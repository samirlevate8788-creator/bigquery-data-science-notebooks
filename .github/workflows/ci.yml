name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Validate Python Syntax
      run: |
        python -m py_compile pipeline.py

    - name: Lint Code
      run: |
        flake8 pipeline.py --count --max-line-length=127 --statistics || true

    - name: Verify SQL Files Exist
      run: |
        ls -la sql/
        echo "All SQL workflow scripts verified!"
